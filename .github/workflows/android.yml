name: Android CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ] # 当 tag 以 "v" 开头时触发
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          # override default build-tools version (33.0.0)
          BUILD_TOOLS_VERSION: "34.0.0"


      - name: Rename Signed APK
        run: mv ${{ steps.sign_app.outputs.signedReleaseFile }} app/build/outputs/apk/release/RedefineNCM_${{ github.ref_name }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedefineNCM_${{ github.ref_name }}
          path: app/build/outputs/apk/release/RedefineNCM_${{ github.ref_name }}.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') # Only on tag pushed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: RedefineNCM_${{ github.ref_name }}
          path: app/build/outputs/apk/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/RedefineNCM_${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
          release_name: "Release ${{ github.ref_name }}"
          body: "Auto build Release Version! 🎉"
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
